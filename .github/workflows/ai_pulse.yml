name: AI Pulse 4-Day Cloud Digest

on:
  schedule:
    # Runs every 4 days at 13:30 UTC (7:00 PM IST)
    - cron: '30 13 */4 * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime

permissions:
  contents: write

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch 15 AI Updates & Update HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_updates.py

      - name: Commit and Push Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync 15 ai updates [skip ci]" && git push)
